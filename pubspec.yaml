name: bina_system
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core functionality
  flutter_gemma: ^0.15.0
  mjpeg_stream: ^1.0.1
  supabase_flutter: 2.9.0
  syncfusion_flutter_pdf: ^30.1.42
  printing: ^5.13.0
  tflite_flutter: 0.12.1
  flutter_onnxruntime: ^1.8.3

  # Navigation
  go_router: 12.1.3
  page_transition: ^2.2.2

  # UI components
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1
  dropdown_button2: 2.3.9
  flutter_animate: 4.5.0
  font_awesome_flutter: 10.7.0
  from_css_color: 2.0.0
  google_fonts: ^6.2.1
  percent_indicator: 4.2.2

  # Utilities
  collection: 1.19.1
  crypto: 3.0.7
  csv: 6.0.0
  intl: 0.20.2
  json_path: 0.7.2
  mask_text_input_formatter: 2.9.0
  mime_type: 1.0.0
  rxdart: 0.27.7
  synchronized: 3.4.0
  timeago: 3.7.1

  # State management
  provider: 6.1.5

  # Storage & files
  file_picker: 10.1.9
  flutter_secure_storage: 10.0.0-beta.4
  image: 4.7.2
  image_picker: 1.1.2
  path_provider: ^2.1.6
  shared_preferences: 2.5.3
  sqflite: 2.3.3+1

  # Media
  url_launcher: 6.3.1
  video_player: 2.10.0

  # Permissions
  permission_handler: ^11.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0

dependency_overrides:
  http: 1.4.0
  rxdart: 0.27.7
  uuid: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: 0.13.1
  flutter_native_splash: ^2.3.0
  flutter_lints: 4.0.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ">=2.4.0"
  fake_async: ^1.3.1
  network_image_mock: ^2.1.1


flutter_native_splash:
  image: assets/images/bina_icon.png
  color: "#FFFFFF"
  android: true
  ios: true
  android_12:
    image: assets/images/bina_icon.png
    color: "#FFFFFF"

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  web:
    generate: true
  image_path: 'assets/images/bina_icon.png'
  adaptive_icon_background: '#00000000'
  adaptive_icon_foreground: 'assets/images/bina_icon.png'


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
    - assets/sqlite_db_files/
    - assets/yolo11n_float16.tflite
    - assets/best_model.tflite
    - assets/cavity_detector_no_nms.tflite
    - assets/model/embeddings/config.json
    - assets/model/embeddings/model_quantized.onnx
    - assets/model/embeddings/model_quantized.onnx_data
    - assets/model/embeddings/special_tokens_map.json
    - assets/model/embeddings/tokenizer.json
    - assets/model/embeddings/tokenizer_config.json
#    - assets/best_float32.tflite
    # Gemma models
    # - Gemma 3 1B is bundled (small enough at ~555MB)
    # - Gemma 4 E2B downloads at runtime (too large at ~2.6GB)
    # - assets/gemma3-1b-it-int4.task
    # - assets/gemma-4-E2B-it.litertlm  # DO NOT BUNDLE - downloads from HuggingFace
    # - assets/gemma-4-E2B-it-web.task  # Web version - uncomment if building for web


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

