<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; background: var(--c-surface); display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip {
    padding: 6px 12px;
    border-radius: var(--r-pill);
    font: var(--t-label-md);
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid transparent;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 999px; }
  .good { background: var(--c-success-100); color: #0e6b48; }
  .good .dot { background: var(--c-dx-good); }
  .plaque { background: #fcf0d8; color: #7a5a17; }
  .plaque .dot { background: var(--c-dx-plaque); }
  .cavity { background: var(--c-error-100); color: #8a2727; }
  .cavity .dot { background: var(--c-dx-cavity); }
  .mixed { background: #f8e1ee; color: #6a2150; }
  .mixed .dot { background: var(--c-dx-mixed); }
  .filter { background: var(--c-surface); border-color: var(--c-line); color: var(--c-ink); }
  .filter.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
  .badge { background: var(--c-coral); color: #fff; min-width: 18px; height: 18px; border-radius: 999px; padding: 0 6px; font: 600 11px/18px var(--f-body); display: inline-flex; align-items: center; justify-content: center; }
  .count { background: var(--c-primary-100); color: var(--c-primary-700); padding: 2px 8px; border-radius: 999px; font: 600 12px/1.4 var(--f-body); }
  .label { font: var(--t-label-md); color: var(--c-ink-3); text-transform: uppercase; letter-spacing: 0.08em; width: 88px; }
</style>
</head>
<body>
  <div class="row"><div class="label">Diagnosis</div>
    <span class="chip good"><span class="dot"></span>Good</span>
    <span class="chip plaque"><span class="dot"></span>Plaque</span>
    <span class="chip cavity"><span class="dot"></span>Cavity</span>
    <span class="chip mixed"><span class="dot"></span>Plaque + Cavity</span>
  </div>
  <div class="row"><div class="label">Filter</div>
    <span class="chip filter active">All</span>
    <span class="chip filter">This week</span>
    <span class="chip filter">Family</span>
    <span class="chip filter">Avi</span>
  </div>
  <div class="row"><div class="label">Counters</div>
    <span class="badge">3</span>
    <span class="badge">12</span>
    <span class="count">4 unread</span>
    <span class="count">Weekly</span>
  </div>
</body></html>
