<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; background: var(--c-surface-alt); }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .card {
    flex: 1;
    background: var(--c-surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--c-line);
    box-shadow: var(--sh-2);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 0;
  }
  .top { display: flex; gap: 12px; align-items: center; }
  .av {
    width: 48px; height: 48px; border-radius: 50%; background: var(--c-primary-100);
    color: var(--c-primary-700);
    display: inline-flex; align-items: center; justify-content: center;
    font: var(--t-title-md); font-weight: 600; flex-shrink: 0;
  }
  .av.coral { background: var(--c-coral-100); color: var(--c-coral-700); }
  .av.aqua { background: var(--c-aqua-100); color: var(--c-aqua-700); }
  .name { font: var(--t-title-md); color: var(--c-ink); }
  .meta { font: var(--t-body-sm); color: var(--c-ink-3); }
  .chip {
    align-self: flex-start;
    padding: 4px 10px;
    border-radius: var(--r-pill);
    font: var(--t-label-sm);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 999px; }
  .good { background: var(--c-success-100); color: #0e6b48; }
  .good .dot { background: var(--c-dx-good); }
  .cavity { background: var(--c-error-100); color: #8a2727; }
  .cavity .dot { background: var(--c-dx-cavity); }
  .plaque { background: #fcf0d8; color: #7a5a17; }
  .plaque .dot { background: var(--c-dx-plaque); }
  .stat { font: var(--t-headline-md); color: var(--c-ink); }
  .stat small { font: var(--t-body-sm); color: var(--c-ink-3); margin-left: 4px; }
  .add {
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
    background: transparent; border: 2px dashed var(--c-line-strong);
    color: var(--c-primary); font: var(--t-label-lg);
  }
  .add svg { width: 28px; height: 28px; }
</style>
</head>
<body>
  <div class="row">
    <div class="card">
      <div class="top">
        <div class="av">AV</div>
        <div style="flex:1;min-width:0">
          <div class="name">Avi</div>
          <div class="meta">8 yrs · last checked 12/05</div>
        </div>
      </div>
      <span class="chip good"><span class="dot"></span>All Good</span>
      <div class="stat">4<small> clean scans</small></div>
    </div>
    <div class="card">
      <div class="top">
        <div class="av coral">MA</div>
        <div style="flex:1;min-width:0">
          <div class="name">Maya</div>
          <div class="meta">11 yrs · last checked 09/05</div>
        </div>
      </div>
      <span class="chip cavity"><span class="dot"></span>Cavity</span>
      <div class="stat">1<small> needs dentist</small></div>
    </div>
    <div class="card">
      <div class="top">
        <div class="av aqua">RO</div>
        <div style="flex:1;min-width:0">
          <div class="name">Ron</div>
          <div class="meta">never checked</div>
        </div>
      </div>
      <span class="chip plaque"><span class="dot"></span>Scan due</span>
      <div class="stat" style="color: var(--c-ink-3)">—</div>
    </div>
    <div class="card add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add member
    </div>
  </div>
</body></html>
