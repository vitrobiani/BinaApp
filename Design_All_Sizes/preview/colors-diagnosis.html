<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; }
  .wrap { padding: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card {
    border-radius: var(--r-md);
    padding: 16px;
    border: 1px solid var(--c-line);
    background: var(--c-surface);
    display: flex; flex-direction: column; gap: 12px;
    min-height: 132px;
  }
  .chip {
    align-self: flex-start;
    padding: 6px 12px;
    border-radius: var(--r-pill);
    font: var(--t-label-md);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 999px; }
  .name { font: var(--t-title-md); color: var(--c-ink); }
  .hex  { font: 500 10px/1 var(--f-mono); color: var(--c-ink-3); letter-spacing: 0.04em; margin-top: auto; }

  .good   { background: var(--c-success-100); color: #0e6b48; }
  .good .dot { background: var(--c-dx-good); }
  .plaque { background: #fcf0d8; color: #7a5a17; }
  .plaque .dot { background: var(--c-dx-plaque); }
  .cavity { background: var(--c-error-100); color: #8a2727; }
  .cavity .dot { background: var(--c-dx-cavity); }
  .mixed  { background: #f8e1ee; color: #6a2150; }
  .mixed .dot { background: var(--c-dx-mixed); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="chip good"><span class="dot"></span>Good</div>
      <div class="name">Clean scan</div>
      <div class="hex">#1AA971</div>
    </div>
    <div class="card">
      <div class="chip plaque"><span class="dot"></span>Plaque</div>
      <div class="name">Brush better</div>
      <div class="hex">#E0A23A</div>
    </div>
    <div class="card">
      <div class="chip cavity"><span class="dot"></span>Cavity</div>
      <div class="name">See a dentist</div>
      <div class="hex">#D94545</div>
    </div>
    <div class="card">
      <div class="chip mixed"><span class="dot"></span>Plaque + Cavity</div>
      <div class="name">Combined</div>
      <div class="hex">#B8538A</div>
    </div>
  </div>
</body></html>
