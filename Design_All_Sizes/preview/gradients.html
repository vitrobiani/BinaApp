<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; }
  .wrap { padding: 24px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
  .g {
    border-radius: var(--r-lg);
    padding: 18px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #fff;
    box-shadow: var(--sh-hero);
  }
  .g.soft { color: var(--c-ink); box-shadow: var(--sh-2); }
  .name { font: var(--t-title-md); }
  .role { font: var(--t-body-sm); opacity: 0.9; }
  .ramp { display: flex; gap: 6px; }
  .ramp i { display: block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); }
  .hero { background: var(--g-hero); }
  .hero-soft { background: var(--g-hero-soft); }
  .coral { background: var(--g-coral); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="g hero">
      <div>
        <div class="name">Hero · home dashboard</div>
        <div class="role">linear-gradient 135° · primary → aqua</div>
      </div>
      <div class="ramp"><i style="background:#1F5BFF"></i><i style="background:#3F84FF"></i><i style="background:#6EC6FF"></i></div>
    </div>
    <div class="g hero-soft soft">
      <div>
        <div class="name">Hero soft</div>
        <div class="role">background washes</div>
      </div>
    </div>
    <div class="g coral">
      <div>
        <div class="name">Coral</div>
        <div class="role">add · create accents</div>
      </div>
    </div>
  </div>
</body></html>
