<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; background: var(--c-surface); }
  .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 88px; height: 88px; background: var(--c-primary-100); border: 1px solid var(--c-primary-300); }
  .name { font: var(--t-label-md); color: var(--c-ink); }
  .meta { font: 10px/1 var(--f-mono); color: var(--c-ink-3); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">xs</div><div class="meta">6px · chips</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">sm</div><div class="meta">10px · fields</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">md (default)</div><div class="meta">14px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">lg</div><div class="meta">20px · hero</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="name">xl</div><div class="meta">28px · sheets</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="meta">CTAs · chips</div></div>
  </div>
</body></html>
