<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; background: var(--c-surface); }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .row .label { width: 140px; font: 11px/1.2 var(--f-mono); color: var(--c-ink-3); }
  .row .bar { background: var(--c-primary); height: 14px; border-radius: 3px; }
  .row .px { font: var(--t-body-sm); color: var(--c-ink-2); margin-left: 8px; }
</style>
</head>
<body>
  <div class="row"><div class="label">--s-1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
  <div class="row"><div class="label">--s-2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><div class="label">--s-3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
  <div class="row"><div class="label">--s-4 (default)</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="label">--s-5</div><div class="bar" style="width:20px"></div><div class="px">20 px</div></div>
  <div class="row"><div class="label">--s-6</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="label">--s-7 (section)</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="label">--s-8</div><div class="bar" style="width:40px"></div><div class="px">40 px</div></div>
  <div class="row"><div class="label">--s-9</div><div class="bar" style="width:56px"></div><div class="px">56 px</div></div>
</body></html>
