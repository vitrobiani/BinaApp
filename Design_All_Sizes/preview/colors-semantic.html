<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; }
  .wrap { padding: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .pill {
    border-radius: var(--r-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid var(--c-line);
    background: var(--c-surface);
    min-height: 120px;
  }
  .dot { width: 28px; height: 28px; border-radius: 999px; box-shadow: var(--sh-1); }
  .name { font: var(--t-title-md); color: var(--c-ink); }
  .role { font: var(--t-body-sm); color: var(--c-ink-2); }
  .hex  { font: 500 10px/1 var(--f-mono); color: var(--c-ink-3); letter-spacing: 0.04em; margin-top: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pill">
      <div class="dot" style="background: var(--c-success)"></div>
      <div class="name">Success</div>
      <div class="role">Clean scan · confirmation</div>
      <div class="hex">#1AA971</div>
    </div>
    <div class="pill">
      <div class="dot" style="background: var(--c-warning)"></div>
      <div class="name">Warning</div>
      <div class="role">Action needed soon</div>
      <div class="hex">#E08A3A</div>
    </div>
    <div class="pill">
      <div class="dot" style="background: var(--c-error)"></div>
      <div class="name">Error</div>
      <div class="role">Failure · destructive</div>
      <div class="hex">#D94545</div>
    </div>
    <div class="pill">
      <div class="dot" style="background: var(--c-info)"></div>
      <div class="name">Info</div>
      <div class="role">Neutral notification</div>
      <div class="hex">#2F8ED8</div>
    </div>
  </div>
</body></html>
