<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; background: var(--c-surface-alt); display: flex; flex-direction: column; gap: 18px; }
  .nav {
    background: var(--c-surface);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-3);
    border: 1px solid var(--c-line);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr 88px 1fr 1fr;
    align-items: center;
    height: 76px;
    position: relative;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--c-ink-3); font: var(--t-label-sm); padding: 8px 0; cursor: pointer; }
  .tab svg { width: 22px; height: 22px; stroke-width: 1.75; }
  .tab.active { color: var(--c-primary); }
  .scan-wrap { display: flex; justify-content: center; }
  .scan {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--g-hero); color: #fff;
    display: grid; place-items: center;
    box-shadow: var(--sh-hero);
    cursor: pointer; border: 4px solid var(--c-surface-alt);
    transform: translateY(-14px);
  }
  .scan svg { width: 28px; height: 28px; }
</style>
</head>
<body>
  <div class="nav">
    <div class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2Z"/></svg>
      <span>Home</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Family</span>
    </div>
    <div class="scan-wrap">
      <div class="scan" aria-label="Scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
      <span>Chat</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.66A8 8 0 0 1 17 20.66"/></svg>
      <span>Profile</span>
    </div>
  </div>
</body></html>
