<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; background: var(--c-surface-alt); }
  .hero {
    background: var(--g-hero);
    border-radius: var(--r-xl);
    color: #fff;
    padding: 24px;
    box-shadow: var(--sh-hero);
    display: grid;
    grid-template-columns: 1fr 160px;
    gap: 16px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: -40% -10% auto auto;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    filter: blur(2px);
  }
  .left { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 1; }
  .overline { font: var(--t-overline); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.78; }
  .title { font: var(--t-display-sm); letter-spacing: -0.01em; }
  .meta { font: var(--t-body-md); opacity: 0.9; }
  .cta {
    align-self: flex-start;
    margin-top: 10px;
    background: rgba(255,255,255,0.96);
    color: var(--c-primary-700);
    border: 0;
    padding: 10px 16px;
    border-radius: var(--r-pill);
    font: var(--t-label-lg);
    cursor: pointer;
  }
  .ring { position: relative; width: 140px; height: 140px; justify-self: end; z-index: 1; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font: var(--t-headline-lg); color: #fff; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="hero">
    <div class="left">
      <div class="overline">Weekly summary</div>
      <div class="title">75% checked</div>
      <div class="meta">1 member undiagnosed · re-scan due Sunday</div>
      <button class="cta">View family</button>
    </div>
    <div class="ring">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="58" stroke="rgba(255,255,255,0.25)" stroke-width="12" fill="none"/>
        <circle cx="70" cy="70" r="58" stroke="rgba(255,255,255,0.95)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="91.1"/>
        <circle cx="70" cy="70" r="40" stroke="rgba(255,255,255,0.25)" stroke-width="12" fill="none"/>
        <circle cx="70" cy="70" r="40" stroke="rgba(255,255,255,0.55)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="62.8"/>
      </svg>
      <div class="pct">75%</div>
    </div>
  </div>
</body></html>
