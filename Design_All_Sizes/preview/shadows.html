<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; background: var(--c-surface-alt); }
  .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .e { background: var(--c-surface); border-radius: var(--r-md); height: 110px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .e .name { font: var(--t-label-lg); color: var(--c-ink); }
  .e .meta { font: 10px/1.3 var(--f-mono); color: var(--c-ink-3); }
  .e1 { box-shadow: var(--sh-1); }
  .e2 { box-shadow: var(--sh-2); }
  .e3 { box-shadow: var(--sh-3); }
  .e4 { box-shadow: var(--sh-4); }
  .hero { box-shadow: var(--sh-hero); background: var(--g-hero); color: #fff; border: 0; }
  .hero .name, .hero .meta { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="e e1"><div class="name">sh-1</div><div class="meta">subtle · resting chips</div></div>
    <div class="e e2"><div class="name">sh-2</div><div class="meta">default card</div></div>
    <div class="e e3"><div class="name">sh-3</div><div class="meta">hover · raised</div></div>
    <div class="e e4"><div class="name">sh-4</div><div class="meta">modal · sheet</div></div>
    <div class="e hero"><div class="name">sh-hero</div><div class="meta">colored glow · home</div></div>
  </div>
</body></html>
