<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; background: var(--c-surface); display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 18px; align-items: stretch; }
  .tile {
    border-radius: var(--r-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--c-line);
    background: var(--c-surface);
    box-shadow: var(--sh-2);
    min-height: 200px;
  }
  .tile .panel { flex: 1; display: grid; place-items: center; padding: 16px; }
  .tile .panel.blue { background: var(--g-hero); }
  .tile .panel.bone { background: var(--c-surface-alt); }
  .tile .panel.dark { background: var(--c-ink); }
  .tile .meta { padding: 10px 14px; font: var(--t-label-sm); color: var(--c-ink-2); border-top: 1px solid var(--c-line); display: flex; justify-content: space-between; }
  .tile img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .splash img { width: 80px; height: 120px; object-fit: cover; object-position: center 12%; border-radius: 12px; }
</style>
</head>
<body>
  <div class="tile splash">
    <div class="panel blue">
      <img src="../assets/BinaSplash.png" alt="Bina splash" style="width: 100%; height: 100%; object-fit: cover" />
    </div>
    <div class="meta"><span>Splash</span><span>BinaSplash.png</span></div>
  </div>
  <div class="tile">
    <div class="panel bone">
      <img src="../assets/app_launcher_icon.png" alt="App icon" style="width: 110px" />
    </div>
    <div class="meta"><span>App icon</span><span>iOS</span></div>
  </div>
  <div class="tile">
    <div class="panel dark">
      <img src="../assets/app_launcher_icon.png" alt="App icon" style="width: 110px" />
    </div>
    <div class="meta"><span>On dark</span><span>Adaptive</span></div>
  </div>
</body></html>
