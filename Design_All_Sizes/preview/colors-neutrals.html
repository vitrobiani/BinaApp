<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; }
  .wrap { padding: 24px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw {
    border-radius: var(--r-md);
    min-height: 100px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--c-line);
  }
  .sw .name { font: var(--t-label-md); color: var(--c-ink); }
  .sw .hex { font: 500 10px/1 var(--f-mono); color: var(--c-ink-3); letter-spacing: 0.04em; }
  .ink   { background: var(--c-ink); color: #fff; border-color: transparent; }
  .ink .name, .ink .hex { color: #fff; }
  .ink2  { background: var(--c-ink-2); color: #fff; border-color: transparent; }
  .ink2 .name, .ink2 .hex { color: #fff; }
  .ink3  { background: var(--c-ink-3); color: #fff; border-color: transparent; }
  .ink3 .name, .ink3 .hex { color: #fff; }
  .line  { background: var(--c-line); }
  .line2 { background: var(--c-line-strong); }
  .surf  { background: var(--c-surface); }
  .alt   { background: var(--c-surface-alt); }
  .sunk  { background: var(--c-surface-sunken); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw ink"><div class="name">Ink</div><div class="hex">#0C1530</div></div>
    <div class="sw ink2"><div class="name">Ink 2</div><div class="hex">#4A516A</div></div>
    <div class="sw ink3"><div class="name">Ink 3</div><div class="hex">#7E859C</div></div>
    <div class="sw line2"><div class="name">Line strong</div><div class="hex">#C9CDD9</div></div>
    <div class="sw line"><div class="name">Line</div><div class="hex">#E6E8F0</div></div>
    <div class="sw sunk"><div class="name">Surface sunken</div><div class="hex">#F1EEE7</div></div>
    <div class="sw alt"><div class="name">Surface alt</div><div class="hex">#FBFAF6</div></div>
    <div class="sw surf"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div>
  </div>
</body></html>
